  <g stroke="#e2ded6" stroke-width="1">
    <line x1="90" y1="440" x2="90" y2="620"/>
    <line x1="490" y1="440" x2="490" y2="620"/>
  </g>

  <text x="80" y="220" font-size="34" font-weight="700" fill="#2c2a25">Environmental Metagenomics</text>
  <text x="80" y="260" font-size="17" fill="#5c5850">Nanopore &amp; Illumina sequencing of PFAS-impacted microbial communities</text>

  <text x="1120" y="770" font-size="12" fill="#8a857c" text-anchor="end" font-family="monospace" letter-spacing="1">PLACEHOLDER — REPLACE WITH LAB PHOTO</text>
