    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- DNA double helix, right side -->
  <g stroke-width="4" fill="none">
    <path d="M 780 260 C 860 320, 700 380, 780 440 C 860 500, 700 560, 780 620" stroke="#0f766e"/>
    <path d="M 980 260 C 900 320, 1060 380, 980 440 C 900 500, 1060 560, 980 620" stroke="#2563eb"/>
  </g>
  <g stroke="#8a857c" stroke-width="2" opacity="0.7">
