    <line x1="810" y1="310" x2="950" y2="310"/>
    <line x1="800" y1="350" x2="960" y2="350"/>
    <line x1="800" y1="390" x2="960" y2="390"/>
    <line x1="810" y1="430" x2="950" y2="430"/>
    <line x1="800" y1="470" x2="960" y2="470"/>
    <line x1="800" y1="510" x2="960" y2="510"/>
    <line x1="810" y1="550" x2="950" y2="550"/>
    <line x1="800" y1="590" x2="960" y2="590"/>
  </g>
  <g fill="#d97706">
    <circle cx="792" cy="272" r="6"/><circle cx="968" cy="272" r="6"/>
    <circle cx="810" cy="310" r="6"/><circle cx="950" cy="310" r="6"/>
    <circle cx="800" cy="350" r="6"/><circle cx="960" cy="350" r="6"/>
    <circle cx="800" cy="390" r="6"/><circle cx="960" cy="390" r="6"/>
    <circle cx="810" cy="430" r="6"/><circle cx="950" cy="430" r="6"/>
    <circle cx="800" cy="470" r="6"/><circle cx="960" cy="470" r="6"/>
    <circle cx="800" cy="510" r="6"/><circle cx="960" cy="510" r="6"/>
    <circle cx="810" cy="550" r="6"/><circle cx="950" cy="550" r="6"/>
    <circle cx="800" cy="590" r="6"/><circle cx="960" cy="590" r="6"/>
  </g>

  <!-- sequencing trace, left side -->
  <g fill="none" stroke-width="3">
    <polyline points="90,560 110,540 130,580 150,500 170,560 190,460 210,560 230,520 250,570 270,480 290,560 310,530 330,580 350,500 370,560 390,460 410,560 430,520 450,570 470,480 490,560" stroke="#059669"/>
    <polyline points="90,600 110,590 130,610 150,580 170,600 190,570 210,600 230,585 250,605 270,575 290,600 310,590 330,610 350,580 370,600 390,570 410,600 430,585 450,605 470,575 490,600" stroke="#2563eb" opacity="0.7"/>
